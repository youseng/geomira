name: deploy

# Every push validates its own SHA. Only the default branch can publish the resulting bytes.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    needs: validate
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: geomira-production
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse an obsolete candidate
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              ...context.repo, branch: context.payload.repository.default_branch
            });
            if (data.commit.sha !== context.sha) {
              core.setFailed('A newer default-branch source exists; this candidate cannot publish.');
            }
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.validate.outputs.pages_artifact }}

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEOMIRA_PAGES_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @geomira/web exec playwright install --with-deps chromium
      - run: pnpm --filter @geomira/web exec playwright test --project=pages
