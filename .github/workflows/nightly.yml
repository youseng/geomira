name: nightly

# The long-running test tier: the test suite with NIGHTLY=1 (later runs add the long
# fuzzing and mutation-testing jobs). Also runs when this file changes, so edits to the
# nightly job are exercised before the next scheduled run.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/nightly.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NIGHTLY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test suite (NIGHTLY=1)
        run: pnpm test
