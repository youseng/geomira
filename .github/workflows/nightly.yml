name: nightly

# The long-running tier: the test suite with NIGHTLY=1, and incremental mutation testing
# (Stryker) of the packages that have a mutation config (SPEC §17 L15; num since Run 1,
# kernel geometry since Run 2, claims since Run 5).
# Mutation scores are reported, not gated, until v1.1. Also runs when this file or a
# mutation config changes, so edits to the nightly jobs are exercised before the next
# scheduled run.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/nightly.yml
      - stryker.*.json
      - vitest.*.config.ts

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NIGHTLY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test suite (NIGHTLY=1)
        run: pnpm test

  # One job per package with a mutation config (L15): num since Run 1, kernel geometry
  # (packages/kernel/src/geom.ts and tools/) since Run 2, packages/claims since Run 5.
  mutation:
    name: mutation-${{ matrix.pkg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        pkg: [num, kernel, claims]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Incremental mode: the previous run's result lets Stryker re-test only mutants whose
      # code or covering tests changed. Each run saves a new entry; the newest is restored.
      - name: Restore incremental mutation result
        uses: actions/cache/restore@v6
        with:
          path: reports/mutation/${{ matrix.pkg }}/stryker-incremental.json
          key: stryker-${{ matrix.pkg }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.pkg }}-
      - name: Mutation testing (packages/${{ matrix.pkg }})
        run: pnpm mutation:${{ matrix.pkg }}
      - name: Save incremental mutation result
        if: always()
        uses: actions/cache/save@v6
        with:
          path: reports/mutation/${{ matrix.pkg }}/stryker-incremental.json
          key: stryker-${{ matrix.pkg }}-${{ github.sha }}-${{ github.run_id }}
      - name: Mutation score summary
        if: always()
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          node -e '
            const pkg = process.env.PKG;
            const r = require(`./reports/mutation/${pkg}/mutation.json`);
            let detected = 0, undetected = 0;
            for (const f of Object.values(r.files)) for (const m of f.mutants) {
              if (["Killed", "Timeout"].includes(m.status)) detected++;
              if (["Survived", "NoCoverage"].includes(m.status)) undetected++;
            }
            const score = (100 * detected / (detected + undetected)).toFixed(2);
            const target = pkg === "num" ? 80 : 75;
            console.log(`${pkg} mutation score: ${score}% (${detected} detected, ${undetected} undetected; target ${target}%, gated from v1.1)`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.pkg }}
          path: reports/mutation/${{ matrix.pkg }}/
          retention-days: 30
