name: nightly

# The long-running tier: the test suite with NIGHTLY=1, and incremental mutation testing
# (Stryker) of the packages that have a mutation config (SPEC §17 L15; num since Run 1,
# kernel geometry since Run 2, claims since Run 5).
# Mutation scores are gated from v1.1 (Run 13): the `mutation-gate` job sums every shard's
# in-scope mutants per package (scripts/mutation-summary.ts --gate) and fails the workflow when
# num is below 80%, the kernel (all its shards), claims or discovery below 75%, or a shard has no report.
# The schedule, a dispatch and every
# push to main run the test suite and mutation testing (ADR-0022), so each merged run gets
# its own scores; a push to another branch runs the test job only, and only when it changes
# this workflow or the mutation and test configuration (scripts/nightly-scope.sh decides).
#
# Mutation is sharded (scripts/mutation-shards.ts): the kernel in eleven shards, num and
# claims whole. Every shard has its own incremental file and cache key, saves them under
# `if: always()`, and gives Stryker its own time limit below the job's, so a finished shard
# keeps its progress even if another shard runs out of time. A dispatch with `full` ignores
# the caches, to measure full runs.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Ignore the incremental caches (measure full mutation runs)'
        type: boolean
        default: false
  # Every push: the scope job below decides what runs (a workflow has one push filter, and
  # main needs every push while other branches need only configuration changes).
  push:
    branches: ['**']
    tags-ignore: ['**']

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test: ${{ steps.scope.outputs.test }}
      mutation: ${{ steps.scope.outputs.mutation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Jobs for this event
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: sh scripts/nightly-scope.sh

  test:
    needs: scope
    if: needs.scope.outputs.test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NIGHTLY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test suite (NIGHTLY=1)
        run: pnpm test

  plan:
    needs: scope
    if: needs.scope.outputs.mutation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - id: shards
        name: Mutation shards
        run: echo "matrix=$(pnpm exec tsx scripts/mutation-shards.ts)" >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation-${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      REPORTS: reports/mutation/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Incremental mode: the previous result lets Stryker re-test only mutants whose code or
      # covering tests changed. Each shard restores the newest entry of its own key.
      - name: Restore incremental mutation result
        if: ${{ !inputs.full }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.REPORTS }}/stryker-incremental.json
          key: stryker-${{ matrix.id }}-${{ github.sha }}
          # The shard's own newest cache; else its parent's (an earlier, coarser shard whose
          # incremental file covers these files: scripts/mutation-shards.ts).
          restore-keys: |
            stryker-${{ matrix.id }}-
            stryker-${{ matrix.parent || matrix.id }}-
      - name: Mutation testing (${{ matrix.id }})
        env:
          MUTATE: ${{ matrix.mutate }}
        run: |
          set -o pipefail
          args=(run "stryker.${{ matrix.pkg }}.json")
          if [ -n "$MUTATE" ]; then args+=(--mutate "$MUTATE"); fi
          start=$(date +%s)
          timeout 100m pnpm exec stryker "${args[@]}"
          echo "${{ matrix.id }}: Stryker took $(( ($(date +%s) - start) / 60 )) min" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save incremental mutation result
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.REPORTS }}/stryker-incremental.json
          key: stryker-${{ matrix.id }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Scored by scripts/mutation-summary.ts: only the shard's own mutants count (the report
      # also carries old results of mutants outside the shard, kept by incremental mode).
      - name: Mutation score summary
        if: always()
        env:
          ID: ${{ matrix.id }}
        run: |
          if [ ! -f "$REPORTS/mutation.json" ]; then
            echo "$ID: no report (Stryker did not finish)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm exec tsx scripts/mutation-summary.ts "$ID" "$REPORTS/mutation.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.id }}
          path: ${{ env.REPORTS }}/
          if-no-files-found: warn
          retention-days: 30

  # The gate (SPEC §17 L15 from v1.1): every shard's report, scored per package over its
  # shards. Runs even when a shard failed or was cancelled, so a missing report is reported
  # (and fails the gate) instead of skipping it.
  mutation-gate:
    needs: [plan, mutation]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Download mutation reports
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-report-*
          path: reports/gate
      - name: Mutation gate
        run: |
          set -o pipefail
          pnpm exec tsx scripts/mutation-summary.ts --gate reports/gate | tee -a "$GITHUB_STEP_SUMMARY"
