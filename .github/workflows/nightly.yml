name: nightly

# The long-running tier: the test suite with NIGHTLY=1, and incremental mutation testing
# (Stryker) of the packages that have a mutation config (SPEC §17 L15; num since Run 1,
# kernel geometry since Run 2, claims since Run 5).
# Mutation scores are reported, not gated, until v1.1. Mutation runs only on schedule and
# workflow_dispatch; a push that changes this file or a test config runs the test job only.
#
# Mutation is sharded (scripts/mutation-shards.ts): the kernel in four file groups, num and
# claims whole. Every shard has its own incremental file and cache key, saves them under
# `if: always()`, and gives Stryker its own time limit below the job's, so a finished shard
# keeps its progress even if another shard runs out of time.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: ['**']
    tags-ignore: ['**']
    paths:
      - .github/workflows/nightly.yml
      - stryker.*.json
      - vitest.*.config.ts
      - scripts/mutation-shards.ts

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NIGHTLY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test suite (NIGHTLY=1)
        run: pnpm test

  plan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - id: shards
        name: Mutation shards
        run: echo "matrix=$(pnpm exec tsx scripts/mutation-shards.ts)" >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation-${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      REPORTS: reports/mutation/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Incremental mode: the previous result lets Stryker re-test only mutants whose code or
      # covering tests changed. Each shard restores the newest entry of its own key.
      - name: Restore incremental mutation result
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.REPORTS }}/stryker-incremental.json
          key: stryker-${{ matrix.id }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.id }}-
      - name: Mutation testing (${{ matrix.id }})
        env:
          MUTATE: ${{ matrix.mutate }}
        run: |
          set -o pipefail
          args=(run "stryker.${{ matrix.pkg }}.json")
          if [ -n "$MUTATE" ]; then args+=(--mutate "$MUTATE"); fi
          start=$(date +%s)
          timeout 100m pnpm exec stryker "${args[@]}"
          echo "${{ matrix.id }}: Stryker took $(( ($(date +%s) - start) / 60 )) min" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save incremental mutation result
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.REPORTS }}/stryker-incremental.json
          key: stryker-${{ matrix.id }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Mutation score summary
        if: always()
        env:
          ID: ${{ matrix.id }}
          PKG: ${{ matrix.pkg }}
        run: |
          if [ ! -f "$REPORTS/mutation.json" ]; then
            echo "$ID: no report (Stryker did not finish)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const { ID: id, PKG: pkg, REPORTS: dir } = process.env;
            const r = require(`./${dir}/mutation.json`);
            let detected = 0, undetected = 0;
            for (const f of Object.values(r.files)) for (const m of f.mutants) {
              if (["Killed", "Timeout"].includes(m.status)) detected++;
              if (["Survived", "NoCoverage"].includes(m.status)) undetected++;
            }
            const score = (100 * detected / (detected + undetected)).toFixed(2);
            const target = pkg === "num" ? 80 : 75;
            console.log(`${id} mutation score: ${score}% (${detected} detected, ${undetected} undetected; target ${target}%, gated from v1.1)`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.id }}
          path: ${{ env.REPORTS }}/
          if-no-files-found: warn
          retention-days: 30
